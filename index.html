  <body class="antialiased">
    <script>
      (function() {
        var t = localStorage.getItem('chamados_ti_theme');
        var d = t === 'light' ? false : t === 'dark' ? true : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (d) document.documentElement.classList.add('dark');
      })();
    </script>
